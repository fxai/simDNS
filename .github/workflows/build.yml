# Build release binaries on demand (Actions tab -> "Build artifacts" -> Run workflow).
name: Build artifacts

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run cargo test before building"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl   # fully static Linux binary
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        if: ${{ inputs.run_tests }}
        run: cargo test --release --target ${{ matrix.target }} --locked

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="simdns-${{ matrix.target }}"
          mkdir -p "$staging"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            bin="simdns.exe"
          else
            bin="simdns"
          fi
          cp "target/${{ matrix.target }}/release/$bin" "$staging/"
          cp README.md config.example.toml "$staging/"
          cp -r docs scenarios "$staging/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$staging.zip" "$staging" >/dev/null
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simdns-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 14
